<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="980" height="640" fill="#0d1117"/>

  <text x="32" y="44" fill="#e6edf3" font-size="21" font-weight="700">AnswerabilityKit</text>
  <text x="32" y="68" fill="#8b949e" font-size="13">Deciding whether a question is worth paying to answer &#8212; upstream of the provider call</text>

  <rect x="32" y="92" width="916" height="74" rx="8" fill="#161b22" stroke="#30363d"/>

  <rect x="48" y="110" width="112" height="38" rx="6" fill="#1f2937" stroke="#3d4655"/>
  <text x="104" y="134" fill="#c9d1d9" font-size="12" text-anchor="middle">retrieve</text>

  <rect x="184" y="110" width="176" height="38" rx="6" fill="#12312a" stroke="#2ea043" stroke-width="2"/>
  <text x="272" y="134" fill="#3fb950" font-size="12" text-anchor="middle" font-weight="700">AnswerabilityKit</text>

  <rect x="384" y="110" width="150" height="38" rx="6" fill="#3a2416" stroke="#bb8009"/>
  <text x="459" y="129" fill="#e3b341" font-size="12" text-anchor="middle">provider call</text>
  <text x="459" y="142" fill="#8b949e" font-size="10" text-anchor="middle">the only paid step</text>

  <rect x="558" y="110" width="120" height="38" rx="6" fill="#1f2937" stroke="#3d4655"/>
  <text x="618" y="134" fill="#c9d1d9" font-size="12" text-anchor="middle">grounding</text>

  <rect x="702" y="110" width="120" height="38" rx="6" fill="#1f2937" stroke="#3d4655"/>
  <text x="762" y="134" fill="#c9d1d9" font-size="12" text-anchor="middle">citations</text>

  <text x="846" y="134" fill="#8b949e" font-size="12">&#8230;</text>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 z" fill="#484f58"/>
    </marker>
  </defs>

  <path d="M160 129 L182 129" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M360 129 L382 129" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M534 129 L556 129" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M678 129 L700 129" stroke="#484f58" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="272" y="186" fill="#8b949e" font-size="11" text-anchor="middle">every stage to the right runs after the money is spent</text>

  <rect x="32" y="210" width="452" height="270" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="238" fill="#e6edf3" font-size="14" font-weight="700">Inside</text>

  <rect x="52" y="254" width="412" height="46" rx="6" fill="#0d1117" stroke="#3d4655"/>
  <text x="66" y="273" fill="#79c0ff" font-size="12">AspectExtracting</text>
  <text x="66" y="291" fill="#8b949e" font-size="11">question &#8594; subject &#183; attribute &#183; constraint</text>

  <rect x="52" y="310" width="412" height="46" rx="6" fill="#0d1117" stroke="#3d4655"/>
  <text x="66" y="329" fill="#79c0ff" font-size="12">EvidenceMatching</text>
  <text x="66" y="347" fill="#8b949e" font-size="11">(aspect, passage) &#8594; strength &#43; polarity, per clause</text>

  <rect x="52" y="366" width="412" height="46" rx="6" fill="#0d1117" stroke="#2ea043"/>
  <text x="66" y="385" fill="#3fb950" font-size="12">AnswerabilityEngine &#8212; struct, synchronous</text>
  <text x="66" y="403" fill="#8b949e" font-size="11">the decision procedure. no state, no I/O</text>

  <rect x="52" y="422" width="412" height="42" rx="6" fill="#0d1117" stroke="#bb8009"/>
  <text x="66" y="441" fill="#e3b341" font-size="12">AnswerabilityGate &#8212; actor</text>
  <text x="66" y="457" fill="#8b949e" font-size="11">owns the running totals, and nothing else</text>

  <rect x="504" y="210" width="444" height="270" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="524" y="238" fill="#e6edf3" font-size="14" font-weight="700">Four verdicts</text>

  <rect x="524" y="252" width="404" height="42" rx="6" fill="#0d1117" stroke="#2ea043"/>
  <text x="538" y="270" fill="#3fb950" font-size="12">.answerable</text>
  <text x="538" y="286" fill="#8b949e" font-size="11">approvedQuestion is non-nil here, and only here</text>

  <rect x="524" y="302" width="404" height="42" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="538" y="320" fill="#f85149" font-size="12">.insufficient(missing:)</text>
  <text x="538" y="336" fill="#8b949e" font-size="11">a gap &#8212; the remedy is to retrieve more</text>

  <rect x="524" y="352" width="404" height="42" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="538" y="370" fill="#f85149" font-size="12">.contested(aspects:)</text>
  <text x="538" y="386" fill="#8b949e" font-size="11">a conflict &#8212; retrieving more makes it worse</text>

  <rect x="524" y="402" width="404" height="62" rx="6" fill="#0d1117" stroke="#8957e5"/>
  <text x="538" y="420" fill="#a371f7" font-size="12">.undetermined(reason)</text>
  <text x="538" y="436" fill="#8b949e" font-size="11">not a soft block &#8212; the absence of a ruling.</text>
  <text x="538" y="452" fill="#8b949e" font-size="11">reachable only by naming unjudgedQuestion</text>

  <rect x="32" y="500" width="916" height="108" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="52" y="527" fill="#e6edf3" font-size="14" font-weight="700">The two knobs pull against each other</text>

  <text x="52" y="553" fill="#3fb950" font-size="12">requiredCoverage &#8593;</text>
  <text x="212" y="553" fill="#c9d1d9" font-size="12">blocks MORE</text>
  <text x="336" y="553" fill="#8b949e" font-size="11">guards against answering with gaps</text>

  <text x="52" y="575" fill="#a371f7" font-size="12">minimumAspects &#8593;</text>
  <text x="212" y="575" fill="#c9d1d9" font-size="12">blocks LESS</text>
  <text x="336" y="575" fill="#8b949e" font-size="11">guards against ruling on a question it never read</text>

  <text x="52" y="597" fill="#8b949e" font-size="11">only the first &#8594; refuses what it could not read &#183; only the second &#8594; refuses nothing at all</text>
</svg>
